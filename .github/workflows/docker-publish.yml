# ============================================================================
# GitHub Action — publica imagens em ghcr.io a cada push em main
# ============================================================================
# Salve este arquivo como `.github/workflows/docker-publish.yml`
#
# Pré-requisito: o repo precisa ter acesso ao Container Registry do GitHub.
# Settings → Packages → todas as imagens públicas/privadas conforme preferir.
# Se private, lembre de criar um PAT com `read:packages` e cadastrar no
# Easypanel → Registry.
#
# Imagens publicadas:
#   ghcr.io/<owner>/vrok-web:latest    + tag por SHA
#   ghcr.io/<owner>/vrok-worker:latest + tag por SHA
# ============================================================================

name: Docker publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: worker
            dockerfile: apps/worker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vrok-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
